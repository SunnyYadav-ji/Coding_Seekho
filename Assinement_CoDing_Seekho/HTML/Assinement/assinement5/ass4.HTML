<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

<body>
    <a  href="ass3.HTML">modiji</a>
    <img src="image.png" alt="modiji" height="200">
    <h1>Self Information</h1>
    <form> 
        <label for="name">Name :</label>
        <input type="text" id="name" name="name"  title="Enter your name" placeholder="Jhon kumar" required minlength="2" maxlength="20" pattern='[A-Za-z\s]+'>
        <br><br>

        <label for="fname">Father Name :</label>
        <input type="text" id ="fname" name="name" placeholder="Father chaursiya" required>
        <br><br>

        <label for ="email">Email :</label>
        <input type="email" 
                id="email" 
               name ="email"
                placeholder="Devil@234gmail.com"
                required
                pattern="[A-Za-z0-9]+'@'[A-Za-z]+\.(com | in | co)$"
                >
        <br><br>

        <label for ="phone">Phone :</label>
        <input type="number" id="phone" name ="phone" placeholder="987456321" required minlength="10">
        <br><br>

        <label>Gender :</label><br>
        <label for="male">Male</label>
        <input type="radio" id="male" value="male" name="Gender">
        <label for="female">Female</label>
        <input type="radio" id="female" value="female" name="Gender">
        <label for="others">Others</label>
        <input type="radio" id="others" value="others" name="Gender">
        <br><br>

        <label for="dob">DOB :</label>
        <input type="date" name="dob"id="dob">
        <br><br>

        <label for="course">Course</label>
        <select name="course" id="course">
            <option value="CS">CS</option>
            <option value="MCA">MCA</option>
            <option value="EE">EE</option>
            <option value="BCA">BCA</option>
        </select>
        <br><br>

       <label for="add">Address</label>
       <textarea id="add" name="add"></textarea>
       <br><br>

      <label for="resume">Upload resume:</label>
      <input type="file" id="resume" name="resume">
      <br><br>

      <label>Hobbies</label><br>
      <label for="cr">Cricket</label>
      <input type="checkbox" name="Hobbies" id="cr" value="cricket">
      <label for="HC">Cricket</label>
      <input type="checkbox" name="Hobbies" id="HC" value="hockey">
      <label for="lu">Ludo</label>
      <input type="checkbox" name="Hobbies" id="lu" value="Ludo">
      <br><br>

      <button>Submit</button>
      


    </form>
