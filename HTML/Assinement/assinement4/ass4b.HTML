<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body >
    <h1>  Assignment 2 - Feedback Form</h1>
    <h1>_________________________________________________</h1>
    <form >
       <label for="f.name">Name:</label>
       <input type="text" id="f.name" name="f.name" required>
       <br><br>

      
       <label for="email">Email:</label>
       <input type="email" id="email" name="email" required>
       <br><br>


       <label for="password">Password:</label>
       <input type="password" id="password" name="password" required>
       <br><br>
       
       <label >Select all emotions that apply to you:</label><br>
         <input type="checkbox" id="Angry" name="Angry">
          <label for="Angry">Angry</label>
          <br><br>
          <input type="checkbox" id="Sad" name="Sad">
           <label for="Sad">Sad</label>
          <br><br>
          <input type="checkbox" id="Happy" name="Happy">
          <label for="Happy">Ambivalent</label>
        <br><br>


       <label for="sat">How satisfied were you with our service!</label><br><br>
       <input type="radio" name="sat" id="very" value="Very satisfied">
       <label for="very">Very satisfied</label><br>
       <input type="radio" name="sat" id="Satisfied" value="Satisfied">
       <label for="Satisfied">Satisfied</label><br>
       <input type="radio" name="sat" id="Did" value="Did not care">
       <label for="Did">Did not care</label><br>
       <input type="radio" name="sat" id="Dis" value="Dissatisfied">
       <label for="Dis">Dissatisfied</label><br>
       <input type="radio" name="sat" id="very dis" value="Very dissatisfied">
       <label for="very dis">Very dissatisfied</label>
       <br><br>

     <label for="comments">Further comments:</label>
     <textarea name="comments" id="comments"></textarea>
     <br><br>
       
     <label for="bio">Bio Photo</label>
     <input type="file" id="bio">
     <br><br>

     <label for="location">Location visited:</label>
     <select name="location" id="location" aria-placeholder="Select location">
     <option value="patna">Patna</option>
     <option value="gaya">Gaya</option>
     </select><br><br>

    <button type="submit">SUBMIT</button>
