<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Assignment 3 - Travel Reservation Form</h1>
    <h1>__________________________________________________________________</h1>
    <form >
        <label for="name">Full name*:</label>
        <input type="text" id="name" placeholder="FirstName LastName" required>
        <br><br>

        <label for="email">Email address*:</label>
        <input type="email"  id="email"  placeholder="FirstName LastName" required>
        <br><br>

        <label for="tour">Select Tour Package*:</label><br>
        <select name="tour" id="tour" required>
        <option value="Goa">Goa</option>
        <option value="Mumbai">Mumbai</option>
        <option value="Delhi">Delhi</option>
        </select><br><br>

        <label for="date">Arrival date*:</label><br>
        <input type="date" id="date" required>
        <br><br>

        <label for="numer">Number of person*:</label><br>
        <input type="number"  id="number" required>
        <br><br>

        <label >What would you want to avail!*</label><br>
        <input type="checkbox" id="boarding">
        <label for="boarding">Boarding</label><br>
        <input type="checkbox" id="Fooding">
        <label for="Fooding">Fooding</label><br>
        <input type="checkbox" id="Sight seeing">
        <label for="Sight seeing">Sight seeing</label><br>

       <label for="code">Discount Coupon code:</label><br>
       <input type="text" id="code"  ><br><br>

       <label for="terms">Terms and conditions*</label><br>
       <input type="radio"  name="Terms and conditions" id="yes">
       <label for="yes">I agree</label>
       <input type="radio" name="Terms and conditions"  id="no">
       <label for="no">I disagree</label>
       <br><br><br>

       <button>Complete reservation</button>















    </form>
</body>
</html>
