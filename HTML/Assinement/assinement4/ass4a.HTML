<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form >
       <label for="f.name">First Name:</label>
       <input type="text" id="f.name" name="f.name" required>
       <br><br>

       <label for="l.name">Last Name:</label>
       <input type="text" id="l.name" name="l.name" required>
       <br><br>

       <label for="email">Email:</label>
       <input type="email" id="email" name="email" required>
       <br><br>


       <label for="password">Password:</label>
       <input type="password" id="password" name="password" required>
       <br><br>
       
       <label >Gender:</label><br>
       <label for="male">Male</label>
       <input type="radio" name="Gender" id="male">
       <label for="female">Female</label>
       <input type="radio" name="Gender" id="female">
       <label for="other">Other</label>
       <input type="radio" name="Gender" id="other">
       <br><br>


       <label for="age">Age:</label>
       <input type="number" id="agge" name="age" maxlength="3" max="100" required>
       <br><br>


    <label >Perferences</label><br>
      <input type="checkbox" id="Acry" name="Perferences">
       <label for="Acry">Acrylic Painting</label>
       <!-- <input type="checkbox" id="Acry" name="Perferences"> -->
       <br><br>
       <input type="checkbox" id="oil" name="Perferences">
        <label for="Oil">Oil Painting</label>
       <br><br>
       <input type="checkbox" id="Water" name="Perferences">
       <label for="Water">Water Color Painting</label>
     <br><br>


     <label for="select">Select Occupation :</label>
     <select name="select" id="select">
        <option value="Student">Student</option>
        <option value="Job Professional">Job Professional</option>
        <option value="Bussines">Bussines</option>
        <option value="Agriculture">Agriculture</option>
     </select>
     <br><br>

     <label for="bio">Bio</label>
     <textarea name="bio" aria-setsize="160" aria-posinset="50"   id="bio" placeholder="Share a few lines about yourself.."></textarea>
     <br><br>

    <button type="reset">RESET</button> <button type="submit">SUBMIT</button>























    </form>
</body>
</html>
