<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form >

<form >
       <label for="f.name">First Name*:</label>
       <input type="text" id="f.name" name="f.name" required>


       <label for="dob">Date of birth*:</label>
       <input type="date" id="dob" name="dob" required>
       <br><br>

       <label for="email">Email*:</label>
       <input type="email" id="email" name="email" required>
       <label for="number">Mobile Number*:</label>
       <input type="number" id="number" name="number" required>
       <br><br>

     
       <label for="F.name">Father Name:</label>
       <input type="text" id="F.name" name="F.name" >
       

       <label for="M.name">Mother Name:</label>
       <input type="text" id="M.name" name="M.name" >
       <br><br>

       
       
       <label >Gender:</label><br>
       <label for="male">Male</label>
       <input type="radio" name="Gender" id="male">
       <label for="female">Female</label>
       <input type="radio" name="Gender" id="female">
       <label for="other">Other</label>
       <input type="radio" name="Gender" id="other">
       <br><br>

     <label for="address">Permanent Address:</label>
     <input type="address" id="address" name="address">
       <h2>Academic Information</h2>
       <label for="course">Course Applying For*:</label>
       <select name="course" id="course">
        <option value="B.tech">B.tech</option>
        <option value="BCA">BCA</option>
        <option value="B.Sc">B.Sc</option>
       </select>

       <label for="branch">  Branch*:</label>
       <select name="branch" id="branch">
        <option value="Computer Science">Computer Science</option>
        <option value="AI">AI</option>
       </select><br><br>


       <label for="class 10">Class 10 percentage:</label>
       <input type="number" max="100" min="0">
       <label for="class 12">  Class 12 percentage:</label>
       <input type="number" max="100" min="0"><br><br>



      <label for="mode">Preferred Study Mode:</label>
      <input type="radio" value="online" name="mode" id="online">
      <label for="online">  online  </label>
       <input type="radio" value="offline" name="mode" id="offline">
      <label for="offline">  offline  </label>
       <input type="radio" value="Hybrid" name="mode" id="Hybrid">
      <label for="Hybrid">  Hybrid  </label><br><br>

      <label ><h2>Skills and Interests</h2></label>
      <input type="checkbox" name="Skills" id="C" value="C Programming">
      <label for="C">C Programming</label>
      <input type="checkbox" name="Skills" id="py" value="python">
      <label for="py">Python</label>
      <input type="checkbox" name="Skills" id="java" value="java">
      <label for="java">java</label><br><br>
      <input type="checkbox" id="Web"  value="Web" name="Skills">
      <label for="Web">Web Development</label>
      <input type="checkbox" id="data"  value="Data Analytics" name="Skills">
      <label for="data">Data Analytics</label>
      <input type="checkbox" id="Cloud"  value="Cloud Computing" name="Skills">
      <label for="Cloud">Cloud Computing</label>
     <br>

     <h2>Documents</h2>
     <br>

     <label for="photo">Upload Photograph*:</label>
     <input type="file" id="photo">
     <label for="resume">Upload Resume*:</label>
     <input type="file" id="resume" ><br>


     <label for="bio">Statement of purpose:</label>
     <input type="text"  id="bio">
     <br><br>

     <input type="checkbox" id="yes" >
     <label for=yes> I confirm that all information provided above is correct.</label>
     <br>
    <button type="reset">RESET</button> <button type="submit">SUBMIT</button>










    </form>
</body>
</html>
